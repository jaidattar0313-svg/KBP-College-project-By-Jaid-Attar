<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- FIX 1: Prevent automatic gesture zoom/pinching -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Responsive Template</title>
  
  <style>
    /* FIX 2: Universal Box Sizing */
    *, *::before, *::after {
      box-sizing: border-box !important;
      margin: 0;
      padding: 0;
    }

    /* FIX 3: Strict Body & HTML Overflow Constraints */
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden !important;
      position: relative;
    }

    /* FIX 4: Word Wrapping & Unbreakable Text Fix */
    /* Prevents long URLs, continuous strings, or titles from forcing the screen width out */
    body, p, h1, h2, h3, h4, h5, h6, span, a, div, td, th {
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
    }

    /* FIX 5: Prevent Fixed-Width Overflows for Media & Containers */
    img, video, canvas, svg, iframe, embed, object {
      max-width: 100% !important;
      height: auto;
    }

    /* FIX 6: Ensure all Containers/Flex/Grid items stay within screen bounds */
    div, section, main, article, header, footer, nav, table {
      max-width: 100% !important;
    }

    /* FIX 7: Disable Mobile iOS/Android Input Auto-Zoom (16px rule) */
    input[type="text"],
    input[type="search"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="tel"],
    input[type="url"],
    textarea,
    select {
      font-size: 16px !important; /* Minimum 16px to stop iOS Safari zoom */
      max-width: 100% !important;
      -webkit-text-size-adjust: 100%;
    }

    /* OPTIONAL: Basic layout styling for scannability */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 16px;
      color: #333;
    }

    .wrapper {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #0066cc;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <h1>Fully Mobile Responsive Template</h1>
    </header>

    <main>
      <section class="form-section">
        <div class="form-group">
          <label for="search">Search</label>
          <input type="search" id="search" placeholder="Type here without mobile auto-zoom...">
        </div>

        <div class="form-group">
          <label for="email">Login Email</label>
          <input type="email" id="email" placeholder="example@domain.com">
        </div>

        <div class="form-group">
          <label for="report">Report Issue</label>
          <textarea id="report" rows="4" placeholder="Describe any issue..."></textarea>
        </div>

        <button type="button" id="submitBtn">Submit</button>
      </section>

      <section style="margin-top: 24px;">
        <h3>Unbreakable Text Test</h3>
        <p>https://example.com/very/long/url/path/that/would/normally/cause/horizontal/overflow/on/mobile/screens/if/word-wrap/was/not/applied</p>
      </section>
    </main>
  </div>

  <script>
    // JavaScript stays completely safe and functional inside this tag.
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('submitBtn');
      if (btn) {
        btn.addEventListener('click', () => {
          console.log('Form submitted safely without layout shifts.');
        });
      }
    });
  </script>

</body>
</html>
