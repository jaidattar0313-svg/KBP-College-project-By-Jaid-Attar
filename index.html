<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lost & Found | Campus Retrieval & Admin Management</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. CORE STYLES & THEME VARIABLES
           ========================================== */
        :root {
            --bg-base: #0B0F17;
            --bg-surface: #111827;
            --bg-card: #1F2937;
            --bg-card-hover: #2D3748;
            
            --primary: #F97316;
            --primary-hover: #EA580C;
            --primary-glow: rgba(249, 115, 22, 0.25);
            
            --accent-blue: #38BDF8;
            --accent-purple: #8B5CF6;
            
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.08);
            
            --status-lost: #EF4444;
            --status-found: #10B981;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.2s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        /* ==========================================
           2. HEADER & NAVIGATION
           ========================================== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text-main);
            text-decoration: none;
            white-space: nowrap;
        }

        .brand-logo i {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .brand-logo span {
            color: var(--primary);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Mode View Switcher Button */
        .view-switch {
            display: flex;
            background: var(--bg-card);
            padding: 4px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .view-switch-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .view-switch-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.65rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-sm {
            padding: 0.45rem 0.85rem;
            font-size: 0.78rem;
            border-radius: 6px;
        }

        .btn-approve {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .btn-approve:hover {
            background: #10B981;
            color: #fff;
        }

        .btn-reject {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-reject:hover {
            background: #EF4444;
            color: #fff;
        }

        /* ==========================================
           3. HERO & SEARCH SECTION
           ========================================== */
        .hero-section {
            padding: 3rem 5% 2rem 5%;
            text-align: center;
            position: relative;
            background: radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.08) 0%, rgba(11, 15, 23, 0) 70%);
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 0.8rem;
        }

        .hero-title span {
            color: var(--primary);
        }

        .hero-subtitle {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 1.8rem auto;
            font-size: 0.95rem;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-surface);
            padding: 8px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-input-wrap {
            flex: 1 1 260px;
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 0 14px;
        }

        .search-input-wrap i {
            color: var(--text-muted);
            margin-right: 10px;
        }

        .search-input-wrap input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 12px 0;
            font-size: 0.9rem;
        }

        .filter-select {
            background: var(--bg-card);
            color: var(--text-main);
            border: none;
            outline: none;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            cursor: pointer;
            flex: 1 1 180px;
        }

        /* ==========================================
           4. PUBLIC CATALOG GRID
           ========================================== */
        .content-section {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 5%;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .tab-group {
            display: flex;
            background: var(--bg-surface);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow-x: auto;
            max-width: 100%;
        }

        .tab-btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--bg-card);
            color: var(--text-main);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(249, 115, 22, 0.4);
        }

        .card-image-wrap {
            height: 180px;
            width: 100%;
            background: var(--bg-card);
            position: relative;
        }

        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            white-space: nowrap;
        }

        .status-badge.type-lost {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #EF4444;
        }

        .status-badge.type-found {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10B981;
        }

        .status-badge.state-approved {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
        }

        .status-badge.state-rejected {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
        }

        .status-badge.state-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #F59E0B;
        }

        .card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-category {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-title {
            font-size: 1.02rem;
            font-weight: 700;
            margin: 4px 0 8px 0;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* ==========================================
           5. PROFESSIONAL ADMIN DASHBOARD
           ========================================== */
        .admin-dashboard {
            display: none; /* Toggled via JS */
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 5%;
        }

        .admin-title-bar {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .admin-title-bar h2 {
            font-size: 1.5rem;
            font-weight: 800;
        }

        /* Top Metric Cards Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .metric-card.total::before { background: var(--accent-blue); }
        .metric-card.lost::before { background: var(--status-lost); }
        .metric-card.found::before { background: var(--status-found); }
        .metric-card.match::before { background: var(--primary); }

        .metric-icon {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: var(--bg-card);
            flex-shrink: 0;
        }

        .metric-card.total .metric-icon { color: var(--accent-blue); }
        .metric-card.lost .metric-icon { color: var(--status-lost); }
        .metric-card.found .metric-icon { color: var(--status-found); }
        .metric-card.match .metric-icon { color: var(--primary); }

        .metric-data h4 {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .metric-data .metric-value {
            font-size: 1.6rem;
            font-weight: 800;
            margin-top: 2px;
            line-height: 1;
        }

        /* Admin Table Panel */
        .admin-table-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .table-header-title {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
            min-width: 600px; /* Ensures table layout remains readable on small screens */
        }

        .admin-table th, 
        .admin-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .admin-table th {
            background: var(--bg-card);
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .admin-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .item-info-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .item-thumb {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            background: var(--bg-card);
            flex-shrink: 0;
        }

        .action-cell {
            display: flex;
            gap: 8px;
            white-space: nowrap;
        }

        /* ==========================================
           6. MODAL SYSTEM
           ========================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--bg-card);
            border: none;
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-surface);
            border: 1px solid var(--primary);
            color: var(--text-main);
            padding: 12px 18px;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 3000;
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition);
            max-width: calc(100vw - 40px);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ==========================================
           7. RESPONSIVE MEDIA QUERIES
           ========================================== */
        @media screen and (max-width: 768px) {
            .navbar {
