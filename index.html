<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaid Attar's Lost & Found</title>
  
  <!-- Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Variables & Theme Engine */
    :root {
      --bg-primary: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      --badge-lost-bg: #fef2f2;
      --badge-lost-text: #dc2626;
      --badge-found-bg: #f0fdf4;
      --badge-found-text: #16a34a;
      
      --status-pending-bg: #fffbe6;
      --status-pending-text: #d48806;
      --status-approved-bg: #f0fdf4;
      --status-approved-text: #16a34a;
      --status-rejected-bg: #fef2f2;
      --status-rejected-text: #dc2626;
    }

    html.dark {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --border-color: #334155;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --badge-lost-bg: rgba(220, 38, 38, 0.2);
      --badge-lost-text: #fca5a5;
      --badge-found-bg: rgba(22, 163, 74, 0.2);
      --badge-found-text: #86efac;

      --status-pending-bg: rgba(212, 136, 6, 0.2);
      --status-pending-text: #ffe58f;
      --status-approved-bg: rgba(22, 163, 74, 0.2);
      --status-approved-text: #86efac;
      --status-rejected-bg: rgba(220, 38, 38, 0.2);
      --status-rejected-text: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
      width: 100%;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.875rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .logo-box {
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 800;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
      box-shadow: 0 2px 4px rgba(124, 58, 237, 0.3);
      flex-shrink: 0;
    }

    .btn {
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      border-color: var(--border-color);
      background-color: transparent;
      color: var(--text-main);
    }

    .btn-outline:hover {
      background-color: var(--border-color);
    }

    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-danger {
      background-color: #dc2626;
      color: #ffffff;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }

    .btn-danger:hover {
      background-color: #b91c1c;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background-color: var(--border-color);
    }

    /* Dropdown Menu */
    .dropdown-wrapper {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 170px;
      box-shadow: var(--shadow-lg);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
    }

    .dropdown-menu.show {
      display: flex;
    }

    .dropdown-item {
      padding: 0.75rem 1rem;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
    }

    .dropdown-item:hover {
      background-color: var(--border-color);
    }

    /* Mobile Navigation */
    .mobile-controls {
      display: none;
      align-items: center;
      gap: 0.5rem;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* HERO SECTION */
    .hero {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.05) 0%, rgba(124, 58, 237, 0.1) 100%);
      padding: 3.5rem 1rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      width: 100%;
    }

    .hero h1 {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      line-height: 1.25;
    }

    .hero p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 1.5rem auto;
      font-size: 1.05rem;
    }

    /* MAIN CONTAINER */
    .main-container {
      max-width: 100%;
      width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
      flex: 1;
    }

    /* SEARCH & FILTER CONTROLS */
    .controls-card {
      background-color: var(--bg-surface);
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      margin-bottom: 2rem;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      margin-bottom: 1rem;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 0.5rem 1.25rem;
      border: none;
      background: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 6px;
      position: relative;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--primary);
      background-color: rgba(124, 58, 237, 0.1);
    }

    /* ITEMS GRID */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      width: 100%;
    }

    .item-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .item-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: var(--border-color);
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .badge-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-lost {
      background-color: var(--badge-lost-bg);
      color: var(--badge-lost-text);
    }

    .badge-found {
      background-color: var(--badge-found-bg);
      color: var(--badge-found-text);
    }

    .status-badge {
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      display: inline-block;
    }

    .status-pending {
      background-color: var(--status-pending-bg);
      color: var(--status-pending-text);
    }

    .status-approved {
      background-color: var(--status-approved-bg);
      color: var(--status-approved-text);
    }

    .status-rejected {
      background-color: var(--status-rejected-bg);
      color: var(--status-rejected-text);
    }

    .ai-score {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      background-color: rgba(124, 58, 237, 0.1);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      flex: 1;
      line-height: 1.4;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    /* ADMIN DASHBOARD STYLES */
    .admin-dashboard {
      display: none;
      width: 100%;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .stat-title {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .table-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .admin-table th, .admin-table td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .admin-table th {
      background-color: var(--bg-primary);
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    .admin-table tbody tr:hover {
      background-color: rgba(124, 58, 237, 0.03);
    }

    .action-cell {
      display: flex;
      gap: 0.5rem;
    }

    /* MODALS */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background-color: var(--bg-surface);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .auth-banner-msg {
      background-color: rgba(124, 58, 237, 0.1);
      color: var(--primary);
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      display: none;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
    }

    .form-row-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .auth-switch {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .auth-switch a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    /* FOOTER */
    footer {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 1.5rem 1rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
      width: 100%;
    }

    /* MEDIA QUERIES FOR MOBILE RESPONSIVENESS */
    @media (max-width: 768px) {
      .desktop-nav {
        display: none;
      }
      .mobile-controls {
        display: flex;
      }
      
      .hero h1 {
        font-size: 1.6rem;
      }

      .hero p {
        font-size: 0.95rem;
      }

      .brand-logo {
        font-size: 1.1rem;
        gap: 0.5rem;
      }

      .logo-box {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }

      .mobile-menu-overlay {
        position: fixed;
        top: 65px;
        left: 0;
        right: 0;
        background-color: var(--bg-surface);
        border-bottom: 1px solid var(--border-color);
        padding: 1rem;
        display: none;
        flex-direction: column;
        gap: 0.75rem;
        box-shadow: var(--shadow-lg);
        z-index: 49;
      }
      .mobile-menu-overlay.active {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="nav-container">
      <a href="#" class="brand-logo" onclick="switchView('student')">
        <div class="logo-box">ZA</div>
        <span>Lost & Found</span>
      </a>

      <!-- Desktop Nav -->
      <div class="desktop-nav">
        <button class="btn btn-outline" id="btn-login-desktop" onclick="openAuthModal('login')">Sign In</button>
        <button class="btn btn-primary" id="btn-signup-desktop" onclick="openAuthModal('signup')">Sign Up</button>
        <button class="icon-btn" id="theme-toggle-desktop" title="Toggle Mode" onclick="toggleTheme()">🌙</button>
        
        <div class="dropdown-wrapper">
          <button class="icon-btn" onclick="toggleDropdown('desktop-dropdown')">⋮</button>
          <div class="dropdown-menu" id="desktop-dropdown">
            <button class="dropdown-item" onclick="alert('Zaid Attar\'s Lost & Found helps campus students quickly report and recover misplaced items using AI-driven matching technology.')">About Us</button>
            <button class="dropdown-item" onclick="alert('Contact: support@zaidattar.edu\nPhone: +91 98765 43210')">Contact Us</button>
            <button class="dropdown-item" onclick="alert('Help Guide:\n1. Search or filter lost/found items.\n2. Login to post missing items.\n3. Verify ownership when claiming.')">Help</button>
            <hr style="border-color: var(--border-color); margin: 0.25rem 0;">
            <button class="dropdown-item" style="color: var(--primary); font-weight: 600;" onclick="openAdminAuthModal()">🔒 Admin Login</button>
          </div>
        </div>
      </div>

      <!-- Mobile Controls -->
      <div class="mobile-controls">
        <button class="icon-btn" id="theme-toggle-mobile" title="Toggle Mode" onclick="toggleTheme()">🌙</button>
        <button class="icon-btn" onclick="toggleMobileMenu()">☰</button>
      </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div class="mobile-menu-overlay" id="mobile-menu">
      <button class="btn btn-outline" onclick="openAuthModal('login'); toggleMobileMenu();">Sign In</button>
      <button class="btn btn-primary" onclick="openAuthModal('signup'); toggleMobileMenu();">Sign Up</button>
      <hr style="border-color: var(--border-color); margin: 0.25rem 0;">
      <button class="dropdown-item" onclick="alert('Zaid Attar\'s Lost & Found helps campus students quickly report and recover misplaced items.'); toggleMobileMenu();">About Us</button>
      <button class="dropdown-item" onclick="alert('Contact: support@zaidattar.edu'); toggleMobileMenu();">Contact Us</button>
      <button class="dropdown-item" onclick="alert('Help Guide: Login to submit reports or claim items.'); toggleMobileMenu();">Help</button>
      <button class="dropdown-item" style="color: var(--primary); font-weight: 600;" onclick="openAdminAuthModal(); toggleMobileMenu();">🔒 Admin Login</button>
    </div>
  </header>

  <!-- STUDENT VIEW -->
  <div id="student-view">
    <!-- HERO SECTION -->
    <section class="hero">
      <h1>Lost Something? We'll Help You Find It.</h1>
      <p>Report misplaced items, explore found belongings, and utilize AI-powered matching across campus.</p>
      <button class="btn btn-primary" onclick="handleActionRequireAuth('Report Item')">+ Report New Item</button>
    </section>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="main-container">
      <!-- SEARCH & FILTER TABS -->
      <div class="controls-card">
        <input type="text" id="search-bar" class="search-input" placeholder="Search by item name, location, or keyword..." oninput="filterItems()">
        
        <div class="filter-tabs">
          <button class="tab-btn active" id="tab-all" onclick="setFilter('all')">All Items</button>
          <button class="tab-btn" id="tab-lost" onclick="setFilter('lost')">Lost</button>
          <button class="tab-btn" id="tab-found" onclick="setFilter('found')">Found</button>
        </div>
      </div>

      <!-- ITEM CARDS GRID -
